# Size-matched geometric gate. Written after the pre-specified structural stopping
# rule was not met, and before any fit. Do not edit this file after a fit starts.
version: geogate-v1
frozen_at: "2026-10-19 15:04:56 CEST"
fits_started: false
target: "PBE bandgap (eV), cohort column bandgap"
unit: eV
protocol: >
  Same as configs/final_v1.yaml: cohort data/cohort_5000_v1.csv and its split,
  CGCNN, 250 epochs, Adam learning rate 0.001, batch size 32, seeds 1-5,
  identical initial weights and mini-batch order across views, CPU,
  3 workers and 3 threads per fit, bitwise-determinism preflight before the fits.
definition:
  P: "number of chemically protected instances (stored protected flag)"
  geometric_gate: >
    Protect the P shortest instances. Ties keep the canonical instance order
    (stable sort by distance). The non-hydrogen degree check and the connectivity
    check are unchanged.
  tau: 0.5
views:
  new: ["Random-Geo@0.5", "BHS-Geo@0.5"]
  ordering:
    Random-Geo: "random order, seed 42, the same order as Random-Chem"
    BHS-Geo: "stored bhs_min, ascending, canonical ties, the same order as BHS-edge-min"
  existing_chemical_arms:
    Random-Geo@0.5: "Random-Chem@0.5 (existing bandgap fits; not retrained)"
    BHS-Geo@0.5: "BHS-edge-min@0.5 (existing bandgap fits; not retrained)"
statistics:
  family: F_geogate
  holm: "within this family of 2, separately for the paired t-test and the exact Wilcoxon test"
  comparisons:
    - {A: "Random-Geo@0.5", B: "Random-Chem@0.5", difference: "MAE(A) - MAE(B)"}
    - {A: "BHS-Geo@0.5", B: "BHS-edge-min@0.5", difference: "MAE(A) - MAE(B)"}
  equivalence_margin_eV: 0.02
  wording: >
    Same rules as configs/final_v1.yaml. better/worse only if the Holm-adjusted
    paired t-test p is below 0.05 and the 95% CI excludes 0; otherwise not
    distinguishable. equivalent only if the 95% CI lies entirely within
    [-0.02, +0.02] eV.
interpretation_fixed_in_advance:
  equivalent: "the benefit is compatible with geometry alone"
  geometric_gate_worse: "evidence that the chemical labels matter"
  geometric_gate_better: "report as such"
structural_stopping_rule:
  threshold: 0.98
  quantity: "pooled removed-set Jaccard for both Random-Geo vs Random-Chem and BHS-Geo vs BHS-Chem"
  if_met: "do not train; report the structural result only"
  source: "results/geogate/geogate_structural_summary.json"
  met: false
