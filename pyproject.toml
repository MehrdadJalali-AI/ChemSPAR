[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chemspar"
dynamic = ["version"]
description = "Auditable, chemistry-constrained sparsification of periodic graphs of metal-organic frameworks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Mehrdad Jalali" },
  { name = "B. Vu" },
  { name = "Swati Chandna" },
  { name = "M. H. Nadimi-Shahraki" },
]
requires-python = ">=3.9"
keywords = ["metal-organic frameworks", "graph sparsification", "crystal graphs", "materials informatics",
            "graph neural networks", "pymatgen"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
# Lower bounds are the versions that produced the paper's results (paper/requirements.txt).
dependencies = [
  "pymatgen>=2024.2.20",
  "numpy>=1.26.4",
  "networkx>=3.2.1",
  "pandas>=2.2.3",
  "pyarrow>=19.0.1",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
pyg = ["torch>=2.4.0", "torch_geometric>=2.6.1"]
dev = ["pytest>=8", "ruff", "mypy", "types-PyYAML", "build", "twine"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.scripts]
chemspar = "chemspar.cli:main"

[project.urls]
Homepage = "https://github.com/MehrdadJalali-AI/ChemSPAR"
Repository = "https://github.com/MehrdadJalali-AI/ChemSPAR"
Issues = "https://github.com/MehrdadJalali-AI/ChemSPAR/issues"
Changelog = "https://github.com/MehrdadJalali-AI/ChemSPAR/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "chemspar/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["chemspar"]

[tool.hatch.build.targets.sdist]
include = ["chemspar", "tests", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff", "pyproject.toml"]
exclude = ["tests/data/qmof/*.cif"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: structures large enough to take more than a few seconds"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["paper"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E702, UP031, B007: the copied paper functions keep their original one-line statements to stay diff-comparable with paper-v1
ignore = ["E702", "E501", "UP006", "UP007", "UP035", "UP045", "UP031", "B007"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["chemspar"]
